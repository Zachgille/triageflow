services:
  postgres:
    image: postgres:16-alpine
    container_name: triageflow-postgres
    environment:
      POSTGRES_USER: triageflow
      POSTGRES_PASSWORD: triageflow
      POSTGRES_DB: triageflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triageflow -d triageflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: triageflow-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
